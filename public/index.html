<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Links v2 - Test Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .response-details {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            max-height: 200px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Perfect Links v2</h1>
        <p class="subtitle">Test de connexion API</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="votre@email.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="submitBtn">
                Se connecter
            </button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script type="module">
        const API_URL = 'https://perfectlinksv2.artkabis.fr/api/login';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        function showMessage(text, type = 'error', details = null) {
            messageEl.className = `message ${type} show`;
            messageEl.innerHTML = text;

            if (details) {
                const detailsEl = document.createElement('div');
                detailsEl.className = 'response-details';
                detailsEl.textContent = JSON.stringify(details, null, 2);
                messageEl.appendChild(detailsEl);
            }
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            if (loading) {
                submitBtn.innerHTML = '<span class="loading"></span>Connexion en cours...';
            } else {
                submitBtn.innerHTML = 'Se connecter';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            setLoading(true);
            messageEl.classList.remove('show');

            try {
                console.log('🚀 Tentative de connexion à:', API_URL);
                console.log('📧 Email:', email);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                console.log('📡 Statut de la réponse:', response.status);
                console.log('📋 Headers de réponse:', [...response.headers.entries()]);

                const data = await response.json();
                console.log('📦 Données reçues:', data);

                if (response.ok) {
                    showMessage(
                        `✅ Connexion réussie ! Bienvenue ${data.user?.email || 'utilisateur'}`,
                        'success',
                        data
                    );

                    // Stocker le token si présent
                    if (data.token) {
                        localStorage.setItem('auth_token', data.token);
                        console.log('🔑 Token stocké dans localStorage');
                    }
                } else {
                    showMessage(
                        `❌ Erreur ${response.status}: ${data.message || 'Identifiants incorrects'}`,
                        'error',
                        data
                    );
                }

            } catch (error) {
                console.error('💥 Erreur complète:', error);

                let errorMessage = '❌ Erreur de connexion: ';

                if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                    errorMessage += 'Impossible de contacter le serveur. Vérifiez CORS et la connexion réseau.';
                } else {
                    errorMessage += error.message;
                }

                showMessage(errorMessage, 'error', {
                    name: error.name,
                    message: error.message,
                    stack: error.stack?.split('\n').slice(0, 3)
                });
            } finally {
                setLoading(false);
            }
        });

        // Log de démarrage
        console.log('✨ Application de test Perfect Links v2 chargée');
        console.log('🔗 API URL:', API_URL);
        console.log('🌐 Origin:', window.location.origin);
    </script>
</body>
</html>
